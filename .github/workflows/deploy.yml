name: Deploy

# Publica la imagen de la API en GitHub Container Registry y actualiza Azure Container Apps.
# El paso de Azure solo corre cuando infra/azure-setup.ps1 ya configuró las variables
# del repositorio (AZURE_RESOURCE_GROUP, AZURE_CONTAINER_APP).

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/prismaslice-api

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - uses: actions/checkout@v5

      - name: Image reference
        id: ref
        # Los nombres de imagen en GHCR deben ir en minúsculas.
        run: echo "image=${IMAGE,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    needs: publish
    if: vars.AZURE_CONTAINER_APP != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # OIDC: sin contraseñas de Azure guardadas en GitHub
      contents: read

    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update container app
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.publish.outputs.image }}" \
            --only-show-errors \
            --query properties.configuration.ingress.fqdn --output tsv
