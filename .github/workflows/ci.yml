name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PrismaSlice.slnx

      - name: Build
        run: dotnet build PrismaSlice.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution PrismaSlice.slnx --configuration Release --no-build

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build --target api --tag prismaslice-api .

      - name: Build seed image
        run: docker build --target seed --tag prismaslice-seed .

      - name: Validate compose file
        run: docker compose config --quiet
