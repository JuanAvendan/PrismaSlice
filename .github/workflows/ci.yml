name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PrismaSlice.slnx

      - name: Build
        run: dotnet build PrismaSlice.slnx --configuration Release --no-restore

      # El modelo ONNX (~310 MB) se cachea por revisión: solo se descarga si cambia.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/embeddinggemma-300m
          key: embeddinggemma-300m-${{ hashFiles('scripts/download-model.sh') }}

      - name: Download embedding model
        run: sh scripts/download-model.sh

      - name: Test
        run: dotnet test --solution PrismaSlice.slnx --configuration Release --no-build
        env:
          REQUIRE_EMBEDDING_MODEL: "true"   # los tests del modelo fallan en vez de saltarse

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build --target api --tag prismaslice-api .

      - name: Build seed image
        run: docker build --target seed --tag prismaslice-seed .

      - name: Validate compose file
        run: docker compose config --quiet
