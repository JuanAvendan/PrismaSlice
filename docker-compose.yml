# Stack completo: docker compose up --build
#   db   → Postgres 17 + pgvector
#   seed → migraciones + datos sintéticos + embeddings (idempotente)
#   api  → http://localhost:8080/swagger
#
# Los embeddings los genera EmbeddingGemma dentro de la API (ONNX Runtime): el
# modelo viene en la imagen, no hace falta Ollama ni una API externa.
# Puertos del host configurables (p. ej. si ya tienes Postgres local): DB_PORT, API_PORT.

# Las imágenes chiseled no traen Kerberos: sin GSS, Npgsql no intenta cargar libgssapi.
x-app-env: &app-env
  ConnectionStrings__Default: Host=db;Port=5432;Database=prisma_slice;Username=prisma;Password=prisma;Gss Encryption Mode=Disable

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: prisma_slice
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d prisma_slice"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    build:
      context: .
      target: seed
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: Development   # habilita Swagger
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
